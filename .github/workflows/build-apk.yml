name: Build & Publish ApexRock Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          elif [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug & Release APK with Gradle
        run: |
          if [ -d "./android" ]; then
            cd android
          fi
          # Build APKs
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease assembleDebug --stacktrace
          else
            gradle assembleRelease assembleDebug --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexRock-Automation-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexRock-Automation-Release-APK
          path: |
            **/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "ApexRock Automation Workstation ${{ github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
